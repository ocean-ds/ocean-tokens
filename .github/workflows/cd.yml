name: CD

# WARNING: GitHub scans the ENTIRE head-commit message of a push — title AND body —
# for CI-skip markers. A commit that merely QUOTES such a marker (for example, when
# describing another commit in the body) will silently suppress this workflow, and no
# release will be published. This already happened once: PR #299 was merged and nothing
# was released because its squashed body quoted a marker verbatim.
# When writing commits that reference those markers, paraphrase them instead.

on:
  push:
    branches:
      - master
      - next

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0 # We need to fetch all tags and branches
          persist-credentials: false

      - name: Use Node.js environment
        uses: actions/setup-node@v2
        with:
          node-version: '14.x'

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        id: yarn-cache # use this to check for `cache-hit` (`steps.yarn-cache.outputs.cache-hit != 'true'`)
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn --frozen-lockfile

      - name: Build all
        run: yarn build

      - name: Creates a release if necessary
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
