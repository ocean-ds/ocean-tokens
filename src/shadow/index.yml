---
global:
  type: shadow
  category: all

imports:
  - ../color/aliases.yml
  - ../opacity/aliases.yml

props:
  - name: shadow-level-1
    value: 0 4px 8px rgba(12, 13, 20, {!opacity-level-semitransparent})
    category: box-shadow

  - name: shadow-level-2
    value: 0 8px 16px rgba(12, 13, 20, {!opacity-level-semitransparent})
    category: box-shadow

  - name: shadow-level-2-top
    value: 0 -8px 16px rgba({!color-interface-dark-pure}, {!opacity-level-semitransparent})
    category: box-shadow
    export-mobile: true

  - name: shadow-level-2-bottom
    value: 0 -8px 16px rgba({!color-interface-dark-pure}, {!opacity-level-semitransparent})
    category: box-shadow
    export-mobile: true
    # Web and iOS keep the published offset until existing consumers migrate.
    android-shadow-offset-y: 8

  - name: shadow-level-3
    value: 0 16px 32px rgba(12, 13, 20, {!opacity-level-semitransparent})
    category: box-shadow

  - name: shadow-level-4
    value: 0 16px 48px rgba(12, 13, 20, {!opacity-level-semitransparent})
    category: box-shadow
